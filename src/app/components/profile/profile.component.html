<!-- Profile -->
<div class="flex items-center gap-x-3" id="home">
  <div class="shrink-0">
    <img
        src="assets/perfilSinFondo.jpg"
        class="w-30 rounded-full shadow-lg ring-4 ring-teal-500/20 dark:ring-teal-400/20"
        alt="Avatar" />
  </div>

  <div class="grow">
    <h1 class="text-xl sm:text-2xl font-semibold text-gray-900 dark:text-white">
      {{ 'profile.name' | transloco }}
    </h1>
    <p class="text-md font-medium text-teal-600 dark:text-teal-400">
      {{ 'profile.work' | transloco }}
    </p>
  </div>
</div>
<!-- End Profile -->

<!-- About -->
<div class="mt-8">
  <p class="text-md text-gray-600 dark:text-gray-300">
    {{ 'profile.p1' | transloco }}
  </p>
  <p class="mt-3 text-md text-gray-600 dark:text-gray-300">
    {{ 'profile.p2' | transloco }}
  </p>

  <div class="mt-6 flex flex-wrap items-center gap-4">
    <a class="inline-flex items-center gap-x-2 text-[14px] text-gray-500 dark:text-gray-400 hover:text-teal-600 dark:hover:text-teal-400 transition-colors">
      <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      juanifabrega1997&#64;gmail.com
    </a>

    <a [href]="'profile.linkCV' | transloco" target="_blank" class="inline-flex items-center gap-x-2 rounded-lg bg-teal-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-teal-700 transition-colors">
      <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
      {{ 'profile.dowloand' | transloco }}
    </a>
  </div>
</div>
<!-- End About -->
